
project:
  name: "Data Processing Performance Benchmark"
  description: "Comparison of baseline and optimized survey data processing"
  random_seed: 42

benchmark:
  methods:
    - baseline
    - proposed

  load_sizes:
    - 100
    - 1000
    - 5000
    - 10000

  warmup_runs: 5
  evaluation_runs: 30

  input_unit: "records"
  latency_unit: "ms"

  bootstrap_iterations: 5000
  confidence_level: 0.95

workload:
  phishing_probability: 0.55
  legitimate_probability: 0.45

  include_missing_values: true
  include_invalid_values: true

output:
  raw_logs: "data/raw/test_run.jsonl"
  processed_metrics: "data/processed/metrics_summary.csv"
  figures_directory: "reports/figures"
