name: Project validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source files
        run: python -m compileall -q src

      - name: Run synthetic benchmark
        run: python src/benchmark.py

      - name: Validate and visualize public survey aggregates
        run: python src/visualize_survey.py

      - name: Check generated outputs
        run: |
          test -s results/sample_metrics.json
          test -s reports/figures/email_response_distribution.png
          test -s reports/figures/email_response_distribution.pdf
          test -s reports/figures/phishing_selection_percentage_by_email.png
          test -s reports/figures/phishing_selection_percentage_by_email.pdf
