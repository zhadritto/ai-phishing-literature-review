
name: Python project checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib seaborn

      - name: Check Python syntax
        run: |
          python -m py_compile src/convert_responses.py
          python -m py_compile src/process_data.py
          python -m py_compile src/visualize.py

      - name: Convert survey responses
        run: python src/convert_responses.py

      - name: Calculate metrics
        run: python src/process_data.py

      - name: Generate figures
        run: python src/visualize.py

      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: research-figures
          path: reports/figures/
